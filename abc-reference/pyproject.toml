[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sadhana-fasttd3-author-abc"
version = "0.1.12"
description = "Explicit ABC-Sim boundary for the original FastTD3 learner."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fast-td3==0.1.0",
  "torch==2.6.0",
  "tensordict==0.7.2",
  "numpy>=1.23,<2",
  "tqdm",
  "tyro",
  "wandb",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sadhana_fasttd3_abc*"]

[tool.setuptools.package-data]
sadhana_fasttd3_abc = ["provenance.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
